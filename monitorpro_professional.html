
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
:root{
--bg:#f4f7fb;
--surface:#ffffff;
--border:#e2e8f0;
--text:#0f172a;
--muted:#64748b;
--primary:#2563eb;
--primary2:#1d4ed8;
--success:#16a34a;
--danger:#dc2626;
--warning:#d97706;
--radius:18px;
}
body{
font-family:Inter,Segoe UI,Arial,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}
.hidden{display:none!important}
.app{min-height:100vh}

/* LOGIN */
@keyframes gradientShift{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
@keyframes floatUp{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}
@keyframes pulseGlow{
0%,100%{opacity:.3;transform:scale(1)}
50%{opacity:.5;transform:scale(1.1)}
}
.auth-screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px;
position:relative;
overflow:hidden;
background:linear-gradient(-45deg,#0f172a,#1e3a8a,#1e40af,#0f172a);
background-size:400% 400%;
animation:gradientShift 15s ease infinite;
}
.auth-screen::before,.auth-screen::after{
content:'';
position:absolute;
border-radius:50%;
pointer-events:none;
}
.auth-screen::before{
width:500px;height:500px;
background:radial-gradient(circle,rgba(59,130,246,.15) 0%,transparent 70%);
top:-100px;right:-100px;
animation:pulseGlow 8s ease-in-out infinite;
}
.auth-screen::after{
width:400px;height:400px;
background:radial-gradient(circle,rgba(99,102,241,.12) 0%,transparent 70%);
bottom:-80px;left:-80px;
animation:pulseGlow 10s ease-in-out infinite;
animation-delay:-4s;
}
.auth-card{
width:100%;
max-width:440px;
background:rgba(255,255,255,.97);
backdrop-filter:blur(20px);
padding:40px 36px;
border-radius:24px;
box-shadow:0 30px 80px rgba(0,0,0,.3);
position:relative;
z-index:1;
animation:floatUp .8s ease-out;
}
.auth-icon{
display:flex;justify-content:center;margin-bottom:12px;
}
.auth-icon i{
font-size:48px;color:var(--primary);
background:linear-gradient(135deg,#3b82f6,#6366f1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.auth-title{
font-size:32px;
font-weight:800;
text-align:center;
margin-bottom:4px;
background:linear-gradient(135deg,#1e3a8a,#3b82f6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.auth-sub{
color:#64748b;
text-align:center;
margin-bottom:28px;
font-size:14px;
}
.field{margin-bottom:20px}
.field label{
display:block;
margin-bottom:8px;
font-size:13px;
font-weight:700;
color:#475569;
}
.field input,.field select,textarea{
width:100%;
padding:14px 16px;
border:1px solid #dbe3ef;
border-radius:14px;
font-size:14px;
background:#fff;
transition:.2s;
}
.field input:focus,.field select:focus,textarea:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

.btn{
border:none;
border-radius:14px;
padding:12px 20px;
font-weight:700;
cursor:pointer;
display:inline-flex;
align-items:center;
gap:8px;
transition:.2s;
}
.btn:hover{
transform:translateY(-1px);
box-shadow:0 10px 20px rgba(0,0,0,.08);
}
.btn-primary{
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff;
}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:var(--warning);color:#fff}
.btn-sm{padding:10px 14px;font-size:13px}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-full{width:100%;justify-content:center}

/* HEADER */
.topbar{
height:72px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 32px;
border-bottom:1px solid var(--border);
box-shadow:0 4px 20px rgba(15,23,42,.05);
position:sticky;
top:0;
z-index:10;
}
.topbar-left,.topbar-right{
display:flex;
align-items:center;
gap:18px;
}
.logo{
font-size:22px;
font-weight:800;
color:#1e3a8a;
}
.nav-tabs{
display:flex;
gap:8px;
}
.nav-tab{
padding:11px 18px;
border:none;
border-radius:14px;
background:#f1f5f9;
color:#475569;
font-weight:600;
cursor:pointer;
transition:.2s;
}
.nav-tab:hover{
background:#e2e8f0;
}
.nav-tab.active{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
}
.role-chip{
padding:7px 12px;
border-radius:999px;
font-size:12px;
font-weight:700;
}
.role-pdo{
background:#dbeafe;
color:#1d4ed8;
}
.role-ao{
background:#dcfce7;
color:#15803d;
}

.main{
padding:34px;
}
.page-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:28px;
}
.page-title{
font-size:30px;
font-weight:800;
}

.grid-2,.grid-3{
display:grid;
gap:24px;
}
.grid-2{
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
}
.grid-3{
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}

/* CARDS */
.card{
background:#fff;
padding:26px;
border-radius:24px;
border:1px solid var(--border);
box-shadow:0 10px 30px rgba(15,23,42,.06);
}
.card-title{
font-size:18px;
font-weight:800;
margin-bottom:10px;
}
.card-meta{
color:var(--muted);
font-size:14px;
line-height:1.6;
}
.card-actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

.stat-card{
background:#fff;
padding:28px;
border-radius:24px;
box-shadow:0 10px 30px rgba(15,23,42,.06);
border:1px solid var(--border);
text-align:center;
}
.stat-label{
font-size:13px;
color:var(--muted);
margin-bottom:8px;
text-transform:uppercase;
font-weight:700;
}
.stat-value{
font-size:38px;
font-weight:800;
}

/* STATUS */
.badge{
display:inline-flex;
align-items:center;
padding:7px 12px;
border-radius:999px;
font-size:12px;
font-weight:700;
}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#dcfce7;color:#15803d}
.badge-red{background:#fee2e2;color:#b91c1c}
.badge-amber{background:#fef3c7;color:#b45309}
.badge-gray{background:#e2e8f0;color:#475569}
.badge-purple{background:#ede9fe;color:#6d28d9}

/* PROGRESS */
.prog-bar{
height:10px;
background:#e2e8f0;
border-radius:999px;
overflow:hidden;
margin-top:10px;
}
.prog-fill{
height:100%;
background:linear-gradient(90deg,#2563eb,#60a5fa);
}

/* TASK */
.task-item,.approval-item{
background:#fff;
padding:14px 16px 12px 16px;
border-radius:12px;
border:1px solid var(--border);
margin-bottom:10px;
border-left:4px solid var(--task-color,var(--border));
}
.task-header{
display:flex;
justify-content:space-between;
gap:8px;
margin-bottom:4px;
}
.task-name{
font-size:14px;
font-weight:600;
}
.task-note,.approval-meta{
font-size:13px;
color:var(--muted);
}
.task-footer{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:6px;
margin-top:6px;
}
.ao-chip{
cursor:pointer;
font-weight:600;
color:var(--ao-color);
transition:opacity .15s;
}
.ao-chip:hover{opacity:.7}
.ao-chip::before{
content:'';
display:inline-block;width:8px;height:8px;border-radius:50%;
background:var(--ao-color);margin-right:4px;vertical-align:middle;
}
.approval-note{
background:#f8fafc;
padding:12px;
border-radius:12px;
margin:12px 0;
}

/* PROGRAM CARDS */
.filter-bar{
display:flex;
align-items:center;
gap:10px;
background:var(--surface);
padding:14px 18px;
border-radius:16px;
border:1px solid var(--border);
margin-bottom:1.25rem;
}
.filter-bar select{
padding:8px 14px;
border:1px solid var(--border);
border-radius:10px;
font-size:13px;
background:var(--bg);
color:var(--text);
outline:none;
cursor:pointer;
}
.filter-bar select:focus{border-color:var(--primary)}
.prog-card{
background:var(--surface);
border-radius:20px;
border:1px solid var(--border);
padding:20px 24px;
margin-bottom:1.25rem;
box-shadow:0 4px 16px rgba(15,23,42,.04);
}
.prog-card-head{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:12px;
margin-bottom:8px;
}
.prog-card-title{
font-size:16px;
font-weight:700;
display:flex;
align-items:center;
gap:8px;
}
.prog-card-title i{color:var(--primary)}
.prog-card-actions{
display:flex;
gap:6px;
flex-shrink:0;
}
.prog-card-meta{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:6px 14px;
font-size:13px;
color:var(--muted);
margin-bottom:8px;
}
.prog-card-meta span{display:flex;align-items:center;gap:5px}
.prog-card-note{
font-size:13px;
color:var(--muted);
margin-bottom:10px;
display:flex;
align-items:flex-start;
gap:6px;
}
.prog-card-note i{flex-shrink:0;margin-top:2px}
.prog-card-progress{
margin-bottom:10px;
}
.prog-card-progress-label{
font-size:12px;
color:var(--muted);
display:block;
text-align:right;
margin-top:2px;
}
.prog-tasks{
margin-top:6px;
}
.prog-tasks-header{
font-size:13px;
font-weight:600;
color:var(--muted);
margin-bottom:10px;
padding-bottom:6px;
border-bottom:1px solid var(--border);
}
.task-pics{
font-size:12px;
color:var(--muted);
margin-bottom:6px;
display:flex;
align-items:center;
flex-wrap:wrap;
gap:6px;
}
.task-footer-left{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:8px;
}
.task-ao-note{
font-size:12px;
color:var(--muted);
display:flex;align-items:center;gap:4px;
}
.task-bukti-link{
font-size:12px;
color:#378ADD;
text-decoration:none;
display:flex;align-items:center;gap:4px;
}
.prog-empty-tasks{
font-size:13px;
color:var(--muted);
font-style:italic;
padding:12px 0 4px;
display:flex;align-items:center;gap:6px;
}
.prog-layout{
display:flex;
gap:1.25rem;
align-items:flex-start;
}
.prog-left{
flex:1;
min-width:0;
}
.ao-panel{
width:380px;
flex-shrink:0;
background:var(--surface);
border-radius:20px;
border:1px solid var(--border);
padding:20px;
position:sticky;
top:1rem;
max-height:calc(100vh - 120px);
overflow-y:auto;
box-shadow:0 4px 16px rgba(15,23,42,.04);
}
.ao-panel-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
padding-bottom:12px;
border-bottom:1px solid var(--border);
}
.ao-panel-title{
font-size:16px;
font-weight:700;
}
.ao-panel-stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-bottom:14px;
}
.ao-stat{
border-radius:12px;
padding:12px 8px;
text-align:center;
background:var(--bg);
}
.ao-stat-val{
font-size:24px;
font-weight:800;
}
.ao-stat-lbl{
font-size:11px;
color:var(--muted);
margin-top:2px;
}
.ao-chip.active{
box-shadow:0 0 0 2px var(--ao-color);
border-radius:4px;
}

/* TABLE */
.table-wrap{
background:#fff;
border-radius:22px;
overflow:hidden;
border:1px solid var(--border);
box-shadow:0 8px 25px rgba(15,23,42,.05);
}
table{
width:100%;
border-collapse:collapse;
}
th{
background:#f8fafc;
padding:16px;
font-size:12px;
text-transform:uppercase;
color:#64748b;
}
td{
padding:16px;
border-top:1px solid var(--border);
}
tr:hover td{
background:#f8fafc;
}
.perm-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.perm-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 16px;
border-radius:12px;
border:1px solid var(--border);
transition:all .2s;
cursor:pointer;
user-select:none;
}
.perm-item:hover{border-color:var(--primary)}
.perm-item.checked{background:#eef2ff;border-color:var(--primary)}
.perm-item.disabled{opacity:.6;background:#f1f5f9;border-color:#e2e8f0}
.perm-item input{position:absolute;opacity:0;pointer-events:none}
.perm-info{display:flex;align-items:center;gap:10px}
.perm-info i{font-size:20px}
.perm-label{font-size:13px;font-weight:600}
.perm-desc{font-size:11px;color:var(--muted);margin-top:1px}
.perm-toggle{width:38px;height:22px;border-radius:11px;position:relative;transition:all .25s;flex-shrink:0}
.perm-toggle.on{background:var(--primary)}
.perm-toggle.off{background:#cbd5e1}
.perm-toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:all .25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.perm-item.checked .perm-toggle::after{left:18px}

/* MODAL */
.modal-overlay{
position:fixed;
inset:0;
background:rgba(15,23,42,.55);
display:flex;
align-items:center;
justify-content:center;
padding:30px;
z-index:100;
backdrop-filter:blur(4px);
}
.modal{
width:100%;
max-width:620px;
background:#fff;
border-radius:28px;
padding:32px;
box-shadow:0 30px 80px rgba(0,0,0,.3);
max-height:90vh;
overflow:auto;
}
.modal-title{
font-size:24px;
font-weight:800;
margin-bottom:24px;
}
.modal-footer{
display:flex;
justify-content:flex-end;
gap:10px;
margin-top:20px;
}
.modal .field{
margin-bottom:16px;
}
.modal select{
width:100%;
padding:14px 16px;
border:1px solid #dbe3ef;
border-radius:14px;
font-size:14px;
background:#fff;
}
.modal .modal-title i{
margin-right:8px;
color:var(--primary);
}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.chip-grid.col{flex-direction:column}
.chip-item{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:13px;transition:.15s;background:#fff;user-select:none;touch-action:none}
.chip-item:has(input:checked){border-color:var(--primary);background:#eef2ff;color:var(--primary);font-weight:600}
.chip-item input{accent-color:var(--primary);margin:0}
.chip-item label{color:inherit;font-size:inherit;background:none;border:none;padding:0;margin:0;pointer-events:none}

.divider{
height:1px;
background:var(--border);
margin:25px 0;
}

.section-label{
font-size:12px;
font-weight:800;
letter-spacing:.08em;
text-transform:uppercase;
color:#64748b;
margin-bottom:14px;
}

.empty-state{
background:#fff;
padding:70px;
border-radius:24px;
text-align:center;
border:1px solid var(--border);
color:#64748b;
box-shadow:0 8px 30px rgba(15,23,42,.05);
}

.err{
margin-top:10px;
font-size:13px;
color:#dc2626;
}

@media(max-width:768px){
.topbar{
height:auto;
padding:20px;
flex-direction:column;
gap:15px;
}
.main{
padding:20px;
}
.page-title{
font-size:24px;
}
.auth-card{
padding:28px 24px;
}
.auth-icon i{
font-size:36px;
}
}
.cal-wrap{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:1.5rem}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-head .month{font-weight:700;font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
.cal-day{padding:8px 4px;border-radius:10px;font-size:13px;cursor:pointer;position:relative;transition:.15s;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-day:hover{background:var(--bg)}
.cal-day.other{color:#ccc}
.cal-day.today{background:#eef2ff;font-weight:700}
.cal-day.has-task{font-weight:700;background:#fee2e2;color:var(--danger);border-radius:10px}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);margin-top:2px}
.cal-day.approved .cal-dot{background:var(--success)}
.cal-day.today.has-task{background:#c7d9fe}
.cal-day.has-task.approved{background:#dcfce7;color:var(--success)}
.cal-day.today.has-task.approved{background:#bbf7d0}
.cal-task-list{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.cal-task-list .cal-task-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
</style>

</head>
<body>
<div class="app" id="app">

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-icon"><i class="ti ti-chart-bar" aria-hidden="true"></i></div>
    <div class="auth-title">TRACKLY</div>
    <div class="auth-sub">Monitoring Program PDO &amp; AO</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="password">
    </div>
    <div id="loginErr" class="err hidden"></div>
    <div style="margin-top:1.25rem">
      <button class="btn btn-primary btn-full" onclick="doLogin()"><i class="ti ti-login" aria-hidden="true"></i> Masuk</button>
    </div>
    
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <span class="logo"><i class="ti ti-chart-bar" aria-hidden="true"></i> TRACKLY</span>
      <nav class="nav-tabs" id="navTabs"></nav>
    </div>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <span class="role-chip" id="roleBadge"></span>
      <button class="btn btn-sm btn-warn" onclick="doLogout()"><i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- MODALS -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

</div>

<script>
// === USER MANAGEMENT ===
const DEFAULT_USERS = {
  admin:{name:'Admin',password:'admin',role:'Admin',area:[],permissions:{dashboard:true,programs:true,approvals:true,export:true,tasks:false,users:true}},
  andri:{name:'Andri',password:'andri',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}},
  puja:{name:'Puja',password:'puja',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}},
  banu:{name:'Banu',password:'banu',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}},
  sandy:{name:'Sandy',password:'sandy',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}},
  ferdinan:{name:'Ferdinan',password:'ferdinan',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}},
  febri:{name:'Febri',password:'febri',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}},
  bagus:{name:'Bagus',password:'bagus',role:'AO',area:[],permissions:{dashboard:true,tasks:true,programs:false,approvals:false,export:false,users:false}}
};

function loadUsers(){
  try{
    const s=localStorage.getItem('monitorpro_users');
    if(s) return JSON.parse(s);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_USERS));
}
function saveUsers(){
  try{localStorage.setItem('monitorpro_users',JSON.stringify(USERS));}catch(e){}
}

let USERS=loadUsers();
let STATE=loadState();

STATE.programs.forEach(p=>{
  if(!p.jadwal){
    const areas=Array.isArray(p.area)?p.area:(p.area?[p.area]:[]);
    if(areas.length) p.jadwal=areas.map(a=>({area:a,tglMulai:p.tglMulai||'',tglSelesai:p.tglSelesai||''}));
    else p.jadwal=[];
    delete p.area; delete p.tglMulai; delete p.tglSelesai;
  }
});
// Migrasi: konversi aoNote (string) ke aoNotes, status (string) ke statuses, pendingApproval/approved ke per-AO
STATE.tasks.forEach(t=>{
  if(typeof t.aoNote==='string'&&t.aoNote){
    t.aoNotes={};
    if(t.assignedPICs&&t.assignedPICs.length) t.aoNotes[t.assignedPICs[0]]=t.aoNote;
    else t.aoNotes._legacy=t.aoNote;
  }
  if(!t.aoNotes||typeof t.aoNotes==='string') t.aoNotes={};
  delete t.aoNote;
  if(typeof t.status==='string'&&t.status){
    t.statuses={};
    if(t.assignedPICs&&t.assignedPICs.length) t.statuses[t.assignedPICs[0]]=t.status;
    else t.statuses._legacy=t.status;
  }
  if(!t.statuses||typeof t.statuses==='string') t.statuses={};
  delete t.status;
  // Migrasi: pendingApproval/approved ke per-AO
  const firstAO=Object.keys(t.statuses||{}).filter(k=>k!=='_legacy')[0]||(t.assignedPICs&&t.assignedPICs.length?t.assignedPICs[0]:null);
  if(!t.pendingApprovals){
    t.pendingApprovals={};
    if(t.pendingApproval&&firstAO) t.pendingApprovals[firstAO]=true;
  }
  if(!t.approvals){
    t.approvals={};
    if(t.approved&&firstAO) t.approvals[firstAO]=true;
  }
  if(!t.rejectionNotes) t.rejectionNotes={};
  delete t.pendingApproval; delete t.approved; delete t.approvalNote;
});

function genId(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return'-';const dt=new Date(d);return dt.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function daysDiff(d){if(!d)return null;const diff=Math.ceil((new Date(d)-new Date())/86400000);return diff}

function getTaskStatus(t,uname){
  if(t.statuses&&t.statuses[uname]) return t.statuses[uname];
  if(t.statuses&&t.statuses._legacy) return t.statuses._legacy;
  return 'belum';
}
function isAOApproved(t,uname){
  return t.approvals&&t.approvals[uname]?true:false;
}
function isTaskApproved(t){
  return t.approvals&&Object.values(t.approvals).some(v=>v)?true:false;
}
function statusBadge(s,approved){
  if(approved) return '<span class="badge badge-green"><i class="ti ti-check" aria-hidden="true"></i> Terverifikasi</span>';
  if(s==='selesai') return '<span class="badge badge-purple"><i class="ti ti-clock" aria-hidden="true"></i> Menunggu</span>';
  if(s==='berjalan') return '<span class="badge badge-blue"><i class="ti ti-player-play" aria-hidden="true"></i> Berjalan</span>';
  return '<span class="badge badge-gray">Belum</span>';
}
function deadlineBadge(d){
  const diff=daysDiff(d);
  if(diff===null) return '';
  if(diff<0) return '<span class="badge badge-red"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Lewat '+Math.abs(diff)+'h</span>';
  if(diff<=7) return '<span class="badge badge-amber"><i class="ti ti-clock" aria-hidden="true"></i> '+diff+' hari</span>';
  return '<span class="badge badge-gray">'+fmtDate(d)+'</span>';
}

function formatAOs(aoList){

const AO_COLORS=['#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#16a34a','#0891b2','#4f46e5','#9333ea','#e11d48','#d97706'];
function getAOColor(uname){
  let h=0;
  for(let i=0;i<uname.length;i++) h=((h<<5)-h)+uname.charCodeAt(i), h|=0;
  return AO_COLORS[Math.abs(h)%AO_COLORS.length];
}

function getJadwal(p){
  if(p.jadwal) return p.jadwal;
  const areas=Array.isArray(p.area)?p.area:(p.area?[p.area]:[]);
  return areas.map(a=>({area:a,tglMulai:p.tglMulai||'',tglSelesai:p.tglSelesai||''}));
}
function fmtJadwal(jadwal){
  return jadwal.map(j=>j.tglMulai&&j.tglSelesai?`${j.area}: ${fmtDate(j.tglMulai)} - ${fmtDate(j.tglSelesai)}`:j.area).join(' &middot; ');
}
function linkify(t){

function getProgTasks(pid){return STATE.tasks.filter(t=>t.programId===pid)}
function getProgProgress(pid){
  const tasks=getProgTasks(pid);
  if(!tasks.length) return 0;
  const done=tasks.filter(t=>isTaskApproved(t)).length;
  return Math.round(done/tasks.length*100);
}
let calMonth=new Date().getMonth(), calYear=new Date().getFullYear();
function renderCalendar(tasks){
  const now=new Date();
  const todayStr=now.toISOString().slice(0,10);
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const taskMap={};
  tasks.forEach(t=>{
    if(t.deadline) taskMap[t.deadline]=(taskMap[t.deadline]||[]).concat(t);
  });
  let html=`<div class="cal-wrap">
    <div class="cal-head">
      <button class="btn btn-sm" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--}showTab('dashboard')"><i class="ti ti-chevron-left"></i></button>
      <span class="month">${months[calMonth]} ${calYear}</span>
      <button class="btn btn-sm" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++}showTab('dashboard')"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid">`;
  const dows=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  dows.forEach(d=>{html+=`<div class="cal-dow">${d}</div>`;});
  for(let i=firstDay-1;i>=0;i--){
    const d=daysInPrev-i;
    html+=`<div class="cal-day other">${d}</div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cal-day'];
    if(dateStr===todayStr) cls.push('today');
    if(taskMap[dateStr]) cls.push('has-task');
    if(taskMap[dateStr]&&taskMap[dateStr].every(t=>isAOApproved(t,currentUser.username))) cls.push('approved');
    const cnt=taskMap[dateStr]?taskMap[dateStr].length:0;
    html+=`<div class="${cls.join(' ')}" onclick="showDayTasks('${dateStr}')">${d}${cnt?`<span class="cal-dot"></span>`:''}</div>`;
  }
  const totalCells=firstDay+daysInMonth;
  const rem=(7-totalCells%7)%7;
  for(let d=1;d<=rem;d++){
    html+=`<div class="cal-day other">${d}</div>`;
  }
  html+=`</div><div id="calTaskList"></div></div>`;
  return html;
}
function showDayTasks(dateStr){
  const el=document.getElementById('calTaskList');
  if(!el) return;
  const dayTasks=STATE.tasks.filter(t=>t.deadline===dateStr).filter(t=>{
    const prog=STATE.programs.find(p=>p.id===t.programId);
    if(!prog) return false;
    const progAreas=getJadwal(prog).map(j=>j.area);
    if(!progAreas.some(a=>currentUser.area.includes(a))) return false;
    return !t.assignedPICs||!t.assignedPICs.length||t.assignedPICs.includes(currentUser.username);
  });
  if(!dayTasks.length){el.innerHTML='';return;}
  el.innerHTML='<div class="cal-task-list">'+dayTasks.map(t=>{
    const prog=STATE.programs.find(p=>p.id===t.programId);
    const icon=isAOApproved(t,currentUser.username)?'ti ti-circle-check-filled':'ti ti-circle';
    const color=isAOApproved(t,currentUser.username)?'var(--success)':'var(--muted)';
    return `<div class="cal-task-item"><i class="${icon}" style="color:${color}"></i> <strong>${t.nama}</strong> — ${prog?prog.name:'-'}</div>`;
  }).join('')+'</div>';
}

function doLogin(){
  const u=document.getElementById('loginUser').value.trim().toLowerCase();
  const p=document.getElementById('loginPass').value;
  const acc=USERS[u];
  if(!acc||acc.password!==p){
    const el=document.getElementById('loginErr');
    el.textContent='Username atau password salah.';
    el.classList.remove('hidden');
    return;
  }
  const areaArr=Array.isArray(acc.area)?acc.area:(acc.area?acc.area.split(',').map(s=>s.trim()).filter(Boolean):[]);
  currentUser={username:u,name:acc.name,role:acc.role,area:areaArr,permissions:acc.permissions};
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  renderApp();
}
function doLogout(){
  currentUser=null;
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';

  else if(id==='my_tasks') c.innerHTML=renderAOTasks();

// === PDO PAGES ===
function renderDonut(slices){
  const total=slices.reduce((s,x)=>s+x.value,0);
  if(!total) return '<div style="text-align:center;padding:40px;color:var(--muted)">Tidak ada data bulan ini</div>';
  const R=90,r=55, cx=120, cy=120;
  let path='', startAngle=-90;
  slices.forEach(s=>{
    const pct=s.value/total;
    const ang=pct*360;
    const a1=startAngle, a2=startAngle+ang;
    const x1=cx+R*Math.cos(a1*Math.PI/180), y1=cy+R*Math.sin(a1*Math.PI/180);
    const x2=cx+R*Math.cos(a2*Math.PI/180), y2=cy+R*Math.sin(a2*Math.PI/180);
    const large=ang>180?1:0;
    path+=`<path d="M${cx} ${cy} L${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} Z" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
    if(pct>=0.06){
      const midAngle=startAngle+ang/2, mr=R/1.6;
      const lx=cx+mr*Math.cos(midAngle*Math.PI/180), ly=cy+mr*Math.sin(midAngle*Math.PI/180);
      path+=`<text x="${lx}" y="${ly}" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${Math.round(pct*100)}%</text>`;
    }
    startAngle+=ang;
  });
  path+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--surface)"/>`;
  const bulan=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][new Date().getMonth()];
  path+=`<text x="${cx}" y="${cy-8}" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="800">${total}</text>
<text x="${cx}" y="${cy+12}" text-anchor="middle" fill="var(--muted)" font-size="11">${bulan}</text>`;
  return `<svg viewBox="0 0 240 240" style="width:240px;height:240px;display:block;margin:0 auto">${path}</svg>`;
}
function renderPDODashboard(){
  const now=new Date();
  const bulan=now.getMonth();
  const tahun=now.getFullYear();
  const aktif=STATE.programs.filter(p=>getJadwal(p).some(j=>{
    if(!j.tglMulai||!j.tglSelesai) return false;
    const m=new Date(now.getFullYear(),bulan,1);
    const mulai=new Date(j.tglMulai), selesai=new Date(j.tglSelesai);
    return mulai<=new Date(m.getFullYear(),m.getMonth()+1,0) && selesai>=m;
  }));
  let selesai=0, berjalan=0, belum=0;
  aktif.forEach(p=>{
    const prog=getProgProgress(p.id);
    if(prog===100) selesai++;
    else if(prog===0) belum++;
    else berjalan++;
  });
  const slices=[
    {label:'Selesai',value:selesai,color:'#16a34a'},
    {label:'Berjalan',value:berjalan,color:'#2563eb'},
    {label:'Belum',value:belum,color:'#d1d5db'}
  ];
  const totalTugas=STATE.tasks.length;
  const tugasSelesai=STATE.tasks.filter(t=>isTaskApproved(t)).length;
  const tugasPending=STATE.tasks.filter(t=>t.pendingApprovals&&Object.values(t.pendingApprovals).some(v=>v)&&!isTaskApproved(t)).length;
  const aoSummary=Object.entries(USERS).filter(([,u])=>u.role==='AO').map(([uname,u])=>{
    const areaList=Array.isArray(u.area)?u.area:(u.area?[u.area]:[]);
    const aoTasks=STATE.tasks.filter(t=>{
      const prog=STATE.programs.find(p=>p.id===t.programId);
      if(!prog) return false;
      const progAreas=getJadwal(prog).map(j=>j.area);
      if(!progAreas.some(a=>areaList.includes(a))) return false;
      return !t.assignedPICs||!t.assignedPICs.length||t.assignedPICs.includes(uname);
    });
  const done=aoTasks.filter(t=>isAOApproved(t,uname)).length;
    const pct=aoTasks.length?Math.round(done/aoTasks.length*100):0;
    return {uname,name:u.name,area:areaList,total:aoTasks.length,done,pct};
  });
  return `
  <div class="page-header"><span class="page-title">Dashboard</span></div>
  <div class="grid-3" style="margin-bottom:1.5rem">
    <div class="stat-card"><div class="stat-label">Program ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][bulan]} ${tahun}</div><div class="stat-value">${aktif.length}</div></div>
    <div class="stat-card"><div class="stat-label">Tugas Selesai</div><div class="stat-value">${tugasSelesai}</div></div>
    <div class="stat-card"><div class="stat-label">Menunggu Verifikasi</div><div class="stat-value" style="color:#BA7517">${tugasPending}</div></div>
    <div class="stat-card"><div class="stat-label">Total Tugas</div><div class="stat-value">${totalTugas}</div></div>
  </div>
  <div class="section-label">Ringkasan Program Bulan ${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][bulan]} ${tahun}</div>

function renderPDOApprovals(){
  const allPending=STATE.tasks.filter(t=>t.pendingApprovals&&Object.values(t.pendingApprovals).some(v=>v));

  const progFilter=document.getElementById('vfProg')?.value||'';
  const aoFilter=document.getElementById('vfAO')?.value||'';
  const progOpts=[...new Set(allPending.map(t=>{const p=STATE.programs.find(x=>x.id===t.programId);return p?p.name:''}).filter(Boolean))];
  const aoOpts=[...new Set(allPending.flatMap(t=>Object.keys(t.pendingApprovals||{}).filter(k=>t.pendingApprovals[k])))];
  let items=[];
  allPending.forEach(t=>{
    const prog=STATE.programs.find(p=>p.id===t.programId)||{};
    const submitters=Object.keys(t.pendingApprovals||{}).filter(k=>t.pendingApprovals[k]);
    submitters.forEach(uname=>{
      if(progFilter&&prog.name!==progFilter) return;
      if(aoFilter&&uname!==aoFilter) return;
      items.push({progName:prog.name||'-',prog,uname,t});
    });
  });
  const byProg={};
  items.forEach(i=>{
    if(!byProg[i.progName]) byProg[i.progName]={};
    if(!byProg[i.progName][i.t.id]) byProg[i.progName][i.t.id]={task:i.t,prog:i.prog,aos:[]};

  return `

  <div class="divider"></div>

        ${Object.entries(USERS).filter(([,u])=>u.role==='AO').map(([uname,u])=>`<option value="${uname}">${u.name}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Filter Status</label>
      <select id="expStatus">
        <option value="">Semua Status</option>
        <option value="belum">Belum</option>
        <option value="berjalan">Berjalan</option>
        <option value="selesai">Selesai (Terverifikasi)</option>
      </select>
    </div>

function doExport(){
  const area=document.getElementById('expArea').value;
  const statusF=document.getElementById('expStatus').value;
  const aoFilter=document.getElementById('expAO').value;
  let rows=[['Program','Area','Tugas','Deadline','AO','Status','Catatan AO','Disetujui','Bukti']];
  STATE.tasks.forEach(t=>{
    const prog=STATE.programs.find(p=>p.id===t.programId)||{};
    const progJadwal=getJadwal(prog);
    const progAreas=progJadwal.map(j=>j.area);
    if(area&&!progAreas.includes(area)) return;
    const taskAOs=(t.assignedPICs&&t.assignedPICs.length?t.assignedPICs:prog.assignedAOs)||[];
    const filteredAOs=aoFilter?taskAOs.filter(a=>a===aoFilter):taskAOs;
    filteredAOs.forEach(uname=>{
      const s=t.statuses&&t.statuses[uname]?t.statuses[uname]:'belum';
      if(statusF==='selesai'&&(s!=='selesai'||!isAOApproved(t,uname))) return;
      if(statusF==='berjalan'&&s!=='berjalan') return;
      if(statusF==='belum'&&s!=='belum') return;
      const note=t.aoNotes&&t.aoNotes[uname]?t.aoNotes[uname]:'';
      rows.push([prog.name||'',fmtJadwal(progJadwal),t.nama,t.deadline,USERS[uname]?USERS[uname].name:uname,s,note,isAOApproved(t,uname)?'Ya':'Tidak',t.bukti||'']);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const colW=rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]||'').length))*1.5);
  ws['!cols']=colW.map(w=>({wch:Math.min(w,50)}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Laporan');
  XLSX.writeFile(wb,'laporan_monitoring.xlsx');
}

function saveUser(){
  const isEdit=document.getElementById('m_uedit').value==='1';
  const uname=document.getElementById('m_uuname').value.trim().toLowerCase();
  const name=document.getElementById('m_uname').value.trim();
  const pass=document.getElementById('m_upass').value;
  const area=document.getElementById('m_uarea').value.split(',').map(s=>s.trim()).filter(Boolean);
  const role=document.getElementById('m_urole').value;
  if(!uname||!name||(!isEdit&&!pass)){document.getElementById('m_err').textContent='Username, nama, dan password wajib diisi.';document.getElementById('m_err').classList.remove('hidden');return;}
  if(!isEdit&&USERS[uname]){document.getElementById('m_err').textContent='Username sudah ada.';document.getElementById('m_err').classList.remove('hidden');return;}
  const permissions={
    dashboard:!!document.querySelector('[name="perm_dashboard"]:checked'),
    tasks:!!document.querySelector('[name="perm_tasks"]:checked'),
    programs:!!document.querySelector('[name="perm_programs"]:checked'),
    approvals:!!document.querySelector('[name="perm_approvals"]:checked'),
    export:!!document.querySelector('[name="perm_export"]:checked'),
    users:!!document.querySelector('[name="perm_users"]:checked')
  };
  USERS[uname]={name,password:pass||USERS[uname]?.password||'',role,area,permissions};
  if(isEdit&&uname!==document.getElementById('m_uold').value){
    delete USERS[document.getElementById('m_uold').value];
  }
  saveUsers();
  closeModal();
  showTab(activeTab);
}

function renderAOTasks(){

        ${t.pendingApprovals&&t.pendingApprovals[currentUser.username]&&!isAOApproved(t,currentUser.username)?`<div style="margin-top:8px;font-size:12px;color:#BA7517"><i class="ti ti-clock" aria-hidden="true"></i> Menunggu verifikasi PDO...</div>`:''}

// === ACTIONS ===
function approveTask(id,uname){
  const t=STATE.tasks.find(x=>x.id===id);
  if(!t) return;
  if(!t.approvals) t.approvals={};
  t.approvals[uname]=true;
  if(t.pendingApprovals) delete t.pendingApprovals[uname];
  const p=STATE.programs.find(x=>x.id===t.programId);
  STATE.approvalLog.push({id:genId(),taskName:t.nama,aoName:USERS[uname]?USERS[uname].name:uname,progName:p?p.name:'-',action:'approve',at:today(),note:''});
  saveState();
  showTab(activeTab);
}

function deleteTask(id){
  if(!confirm('Hapus tugas ini?')) return;
  STATE.tasks=STATE.tasks.filter(t=>t.id!==id);
  saveState();
  showTab(activeTab);
}
function deleteApprovalLog(id){
  if(!confirm('Hapus riwayat ini?')) return;
  STATE.approvalLog=STATE.approvalLog.filter(l=>l.id!==id);
  saveState();
  showTab(activeTab);
}
function toggleAll(c,on){
  document.querySelectorAll('.'+c).forEach(cb=>{
    cb.checked=on;
    if(c==='m_area_cb'){
      const p=cb.closest('.jadwal-row,.area-row');
      if(p){p.style.borderColor=on?'var(--primary)':'#e2e8f0';p.style.background=on?'#eef2ff':'#fff'}
      const dp=cb.closest('div');
      if(dp&&!p){dp.style.borderColor=on?'var(--primary)':'#e2e8f0';dp.style.background=on?'#eef2ff':'#fff'}
      const jr=cb.closest('.jadwal-row');
      if(jr&&typeof toggleJadwalRow==='function') toggleJadwalRow(cb);
    }
  });
}
function clearAllApprovalLog(){
  if(!confirm('Hapus semua riwayat verifikasi?')) return;
  STATE.approvalLog=[];
  saveState();
  showTab(activeTab);
}
function deleteProgram(id){
  if(!confirm('Hapus program ini beserta semua tugasnya?')) return;
  STATE.programs=STATE.programs.filter(p=>p.id!==id);
  STATE.tasks=STATE.tasks.filter(t=>t.programId!==id);
  saveState();
  showTab(activeTab);
}

            <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;min-width:100px;user-select:none"><input type="checkbox" class="m_area_cb" value="${a}" ${ch} onchange="this.closest('.jadwal-row').style.borderColor=this.checked?'var(--primary)':'#e2e8f0';toggleJadwalRow(this)"> ${a}</label>

            <span class="jadwal-date" style="${ch?'':'display:none;'}font-size:12px;color:var(--muted)">-</span>
            <input type="date" class="m_tglSelesai jadwal-date" value="${j?j.tglSelesai:''}" style="${ch?'':'display:none;'}padding:6px 10px;border:1px solid var(--border);border-radius:10px;font-size:12px">
          </div>`;}).join('')}
        </div>
      </div>
    </div>
    <div class="field">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <label style="font-weight:700;font-size:13px">Assign AO</label>
        <span style="font-size:12px"><a href="#" onclick="event.preventDefault();toggleAll('m_ao_cb',true)" style="color:var(--primary);cursor:pointer">Pilih Semua</a> · <a href="#" onclick="event.preventDefault();toggleAll('m_ao_cb',false)" style="color:var(--muted);cursor:pointer">Hapus</a></span>

        ${aoList2.map(([uname,u])=>`<div class="chip-item"><input type="checkbox" class="m_ao_cb" value="${uname}" ${(prog.assignedAOs||[]).includes(uname)?'checked':''}><label>${u.name}</label></div>`).join('')}

    </div>
    <div class="field"><label style="font-weight:700;font-size:13px;color:#475569">Catatan</label><textarea id="m_catatan" rows="3" style="width:100%;padding:14px 16px;border:1px solid #dbe3ef;border-radius:14px;font-size:14px;background:#fff">${prog.catatan||''}</textarea></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

  } else if(type==='updateTask'){

    mc.innerHTML=`

    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:16px">

      ${t.catatan?`<div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:4px;margin-top:8px"><i class="ti ti-notes" aria-hidden="true"></i> Catatan dari pembuat tugas</div>

    </div>
    ${t.rejectionNotes&&t.rejectionNotes[currentUser.username]?`<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px 16px;margin-bottom:16px">

    <div class="field"><label>Status</label>
      <select id="m_tstatus">
        <option value="belum"${getTaskStatus(t,currentUser.username)==='belum'?' selected':''}>Belum dimulai</option>
        <option value="berjalan"${getTaskStatus(t,currentUser.username)==='berjalan'?' selected':''}>Sedang berjalan</option>

    <div class="field"><label style="font-weight:700;font-size:13px;color:#475569">Catatan update</label><textarea id="m_tnote" rows="3" placeholder="Jelaskan perkembangan atau hasil" style="width:100%;padding:14px 16px;border:1px solid #dbe3ef;border-radius:14px;font-size:14px;background:#fff">${(t.aoNotes&&t.aoNotes[currentUser.username])||''}</textarea></div>
    <div class="field"><label style="font-weight:700;font-size:13px;color:#475569">Link Bukti (URL)</label><input type="text" id="m_tbukti" value="${t.bukti||''}" placeholder="https://drive.google.com/..." style="width:100%;padding:14px 16px;border:1px solid #dbe3ef;border-radius:14px;font-size:14px;background:#fff"></div>
    <div id="m_err" class="err hidden"></div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">Batal</button>

    </div>`;
  } else if(type==='rejectTask'){
    const parts=arg.split('|');
    const tid=parts[0];
    const runame=parts[1]||'';
    mc.innerHTML=`
    <div class="modal-title"><i class="ti ti-x" aria-hidden="true"></i> Tolak Update${runame?' — '+(USERS[runame]?USERS[runame].name:runame):''}</div>
    <input type="hidden" id="m_rid" value="${tid}">
    <input type="hidden" id="m_runame" value="${runame}">
    <div class="field"><label>Alasan penolakan</label><textarea id="m_rnote" rows="3" placeholder="Berikan alasan agar AO bisa memperbaiki"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">Batal</button>
      <button class="btn btn-sm btn-danger" onclick="rejectTask()"><i class="ti ti-x" aria-hidden="true"></i> Tolak</button>
    </div>`;
  } else if(type==='newUser'||type==='editUser'){
    const isEdit=type==='editUser';
    const u=isEdit?USERS[arg]:null;
    mc.innerHTML=`
    <div class="modal-title"><i class="ti ti-${isEdit?'edit':'user-plus'}" aria-hidden="true"></i> ${isEdit?'Edit User':'Tambah User Baru'}</div>
    <input type="hidden" id="m_uedit" value="${isEdit?'1':'0'}">
    ${isEdit?`<input type="hidden" id="m_uold" value="${arg}">`:''}
    <div class="field"><label>Username</label><input type="text" id="m_uuname" value="${isEdit?arg:''}" placeholder="username" ${isEdit?'readonly style="background:#f1f5f9"':''}></div>
    <div class="field"><label>Nama Lengkap</label><input type="text" id="m_uname" value="${isEdit?u.name:''}" placeholder="Nama lengkap"></div>
    <div class="field"><label>Password ${isEdit?'(kosongkan jika tidak diubah)':''}</label><input type="password" id="m_upass" placeholder="password"></div>
    <div class="field"><label>Role</label>
      <select id="m_urole">
        <option value="AO"${isEdit&&u.role==='AO'?' selected':''}>AO</option>
        <option value="Admin"${isEdit&&u.role==='Admin'?' selected':''}>Admin</option>
      </select>
    </div>
    <div class="field"><label>Area</label><input type="text" id="m_uarea" value="${isEdit?(Array.isArray(u.area)?u.area.join(', '):u.area||''):''}" placeholder="Pisahkan dengan koma jika lebih dari satu (contoh: Surabaya, Jakarta)"></div>
    <div class="field">
      <label style="margin-bottom:12px"><i class="ti ti-lock" style="margin-right:6px;color:var(--primary)"></i>Akses Menu</label>
      <div class="perm-grid" id="m_perm_grid">
        <div class="perm-item${isEdit&&u.permissions.tasks?' checked':''}" onclick="this.classList.toggle('checked');this.querySelector('input').checked=!this.querySelector('input').checked;this.querySelector('.perm-toggle').className='perm-toggle '+(this.querySelector('input').checked?'on':'off')">
          <div class="perm-info"><i class="ti ti-checklist"></i><div><div class="perm-label">Tugas</div><div class="perm-desc">Lihat & update tugas</div></div></div>
          <div class="perm-toggle ${isEdit&&u.permissions.tasks?'on':'off'}"></div>
          <input type="checkbox" name="perm_tasks" ${isEdit&&u.permissions.tasks?'checked':''}>
        </div>
        <div class="perm-item${isEdit&&u.permissions.programs?' checked':''}" onclick="this.classList.toggle('checked');this.querySelector('input').checked=!this.querySelector('input').checked;this.querySelector('.perm-toggle').className='perm-toggle '+(this.querySelector('input').checked?'on':'off')">
          <div class="perm-info"><i class="ti ti-folder"></i><div><div class="perm-label">Program</div><div class="perm-desc">Kelola program</div></div></div>
          <div class="perm-toggle ${isEdit&&u.permissions.programs?'on':'off'}"></div>
          <input type="checkbox" name="perm_programs" ${isEdit&&u.permissions.programs?'checked':''}>
        </div>
        <div class="perm-item${isEdit&&u.permissions.approvals?' checked':''}" onclick="this.classList.toggle('checked');this.querySelector('input').checked=!this.querySelector('input').checked;this.querySelector('.perm-toggle').className='perm-toggle '+(this.querySelector('input').checked?'on':'off')">
          <div class="perm-info"><i class="ti ti-circle-check"></i><div><div class="perm-label">Verifikasi</div><div class="perm-desc">Setujui / tolak tugas</div></div></div>
          <div class="perm-toggle ${isEdit&&u.permissions.approvals?'on':'off'}"></div>
          <input type="checkbox" name="perm_approvals" ${isEdit&&u.permissions.approvals?'checked':''}>
        </div>
        <div class="perm-item${isEdit&&u.permissions.export?' checked':''}" onclick="this.classList.toggle('checked');this.querySelector('input').checked=!this.querySelector('input').checked;this.querySelector('.perm-toggle').className='perm-toggle '+(this.querySelector('input').checked?'on':'off')">
          <div class="perm-info"><i class="ti ti-download"></i><div><div class="perm-label">Export</div><div class="perm-desc">Download laporan</div></div></div>
          <div class="perm-toggle ${isEdit&&u.permissions.export?'on':'off'}"></div>
          <input type="checkbox" name="perm_export" ${isEdit&&u.permissions.export?'checked':''}>
        </div>
        <div class="perm-item${isEdit&&u.permissions.users?' checked':''}" onclick="this.classList.toggle('checked');this.querySelector('input').checked=!this.querySelector('input').checked;this.querySelector('.perm-toggle').className='perm-toggle '+(this.querySelector('input').checked?'on':'off')">
          <div class="perm-info"><i class="ti ti-users"></i><div><div class="perm-label">Users</div><div class="perm-desc">Kelola akun user</div></div></div>
          <div class="perm-toggle ${isEdit&&u.permissions.users?'on':'off'}"></div>
          <input type="checkbox" name="perm_users" ${isEdit&&u.permissions.users?'checked':''}>
        </div>
        <div class="perm-item disabled">
          <div class="perm-info"><i class="ti ti-dashboard"></i><div><div class="perm-label">Dashboard</div><div class="perm-desc">Selalu aktif</div></div></div>
          <div class="perm-toggle on"></div>
          <input type="checkbox" name="perm_dashboard" checked disabled>
        </div>

    </div>
    <div id="m_err" class="err hidden"></div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">Batal</button>

    </div>`;
  }
}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden')}

function saveProgram(){
  const name=document.getElementById('m_name').value.trim();
  const jenis=document.getElementById('m_jenis').value;
  const catatan=document.getElementById('m_catatan').value.trim();
  const waktuVal=document.getElementById('m_waktu').value;
  const areaRoot=waktuVal?document.getElementById('m_area_'+(waktuVal==='sama'?'sama':'beda')):null;
  const areas=[...(areaRoot?areaRoot.querySelectorAll('.m_area_cb:checked'):[])].map(cb=>cb.value);
  if(!name||!areas.length){document.getElementById('m_err').textContent='Nama program dan minimal satu area wajib diisi.';document.getElementById('m_err').classList.remove('hidden');return;}
  const jadwal=[];
  if(waktuVal==='sama'){
    const tm=document.getElementById('m_tglMulai').value;
    const ts=document.getElementById('m_tglSelesai').value;
    areas.forEach(a=>jadwal.push({area:a,tglMulai:tm,tglSelesai:ts}));
  } else {
    areas.forEach(a=>{
      const row=document.querySelector(`.jadwal-row[data-area="${a}"]`);
      jadwal.push({area:a,tglMulai:row?row.querySelector('.m_tglMulai').value:'',tglSelesai:row?row.querySelector('.m_tglSelesai').value:''});
    });
  }
  const assignedAOs=[...document.querySelectorAll('.m_ao_cb:checked')].map(cb=>cb.value);
  STATE.programs.push({id:genId(),name,jenis,jadwal,catatan,createdAt:today(),assignedAOs});
  saveState();closeModal();showTab(activeTab);
}

function saveProgramEdit(){
  const id=document.getElementById('m_pid_edit').value;
  const prog=STATE.programs.find(x=>x.id===id);
  if(!prog) return;
  prog.name=document.getElementById('m_name').value.trim();
  prog.jenis=document.getElementById('m_jenis').value;
  prog.catatan=document.getElementById('m_catatan').value.trim();
  const waktuVal=document.getElementById('m_waktu').value;
  const areaRoot=waktuVal?document.getElementById('m_area_'+(waktuVal==='sama'?'sama':'beda')):null;
  const areas=[...(areaRoot?areaRoot.querySelectorAll('.m_area_cb:checked'):[])].map(cb=>cb.value);
  if(!prog.name||!areas.length){document.getElementById('m_err').textContent='Nama program dan minimal satu area wajib diisi.';document.getElementById('m_err').classList.remove('hidden');return;}
  prog.jadwal=[];
  if(waktuVal==='sama'){
    const tm=document.getElementById('m_tglMulai').value;
    const ts=document.getElementById('m_tglSelesai').value;
    areas.forEach(a=>prog.jadwal.push({area:a,tglMulai:tm,tglSelesai:ts}));
  } else {
    areas.forEach(a=>{
      const row=document.querySelector(`.jadwal-row[data-area="${a}"]`);
      prog.jadwal.push({area:a,tglMulai:row?row.querySelector('.m_tglMulai').value:'',tglSelesai:row?row.querySelector('.m_tglSelesai').value:''});
    });
  }
  prog.assignedAOs=[...document.querySelectorAll('.m_ao_cb:checked')].map(cb=>cb.value);
  saveState();closeModal();showTab(activeTab);
}

function saveTask(){
  const pid=document.getElementById('m_pid').value;
  const nama=document.getElementById('m_tname').value.trim();
  const deadline=document.getElementById('m_tdeadline').value;
  const catatan=document.getElementById('m_tcatatan').value.trim();
  const assignedPICs=[...document.querySelectorAll('.m_pic_cb:checked')].map(cb=>cb.value);
  if(!nama||!deadline){document.getElementById('m_err').textContent='Nama dan deadline wajib diisi.';document.getElementById('m_err').classList.remove('hidden');return;}
  STATE.tasks.push({id:genId(),programId:pid,nama,deadline,catatan,assignedPICs,statuses:{},aoNotes:{},bukti:'',pendingApprovals:{},approvals:{},rejectionNotes:{},updatedAt:''});
  saveState();closeModal();showTab(activeTab);
}

function saveTaskEdit(){
  const id=document.getElementById('m_tid_edit').value;
  const t=STATE.tasks.find(x=>x.id===id);
  if(!t) return;
  t.nama=document.getElementById('m_tname').value.trim();
  t.deadline=document.getElementById('m_tdeadline').value;
  t.catatan=document.getElementById('m_tcatatan').value.trim();
  t.assignedPICs=[...document.querySelectorAll('.m_pic_cb:checked')].map(cb=>cb.value);
  if(!t.nama||!t.deadline){document.getElementById('m_err').textContent='Nama dan deadline wajib diisi.';document.getElementById('m_err').classList.remove('hidden');return;}
  saveState();closeModal();showTab(activeTab);
}

function saveTaskUpdate(){
  const id=document.getElementById('m_tid').value;
  const status=document.getElementById('m_tstatus').value;
  const note=document.getElementById('m_tnote').value.trim();
  const bukti=document.getElementById('m_tbukti').value.trim();
  const t=STATE.tasks.find(x=>x.id===id);
  if(!t) return;
  if(!t.statuses) t.statuses={};
  t.statuses[currentUser.username]=status;
  if(!t.aoNotes) t.aoNotes={};
  t.aoNotes[currentUser.username]=note;
  t.bukti=bukti;
  t.pendingApprovals[currentUser.username]=true;
  delete t.approvals[currentUser.username];
  if(t.rejectionNotes) delete t.rejectionNotes[currentUser.username];
  t.updatedAt=today();
  saveState();closeModal();showTab(activeTab);
}

function rejectTask(){
  const id=document.getElementById('m_rid').value;
  const runame=document.getElementById('m_runame').value;
  const note=document.getElementById('m_rnote').value.trim();
  const t=STATE.tasks.find(x=>x.id===id);
  if(!t) return;
  if(t.pendingApprovals) delete t.pendingApprovals[runame];
  if(!t.rejectionNotes) t.rejectionNotes={};
  t.rejectionNotes[runame]=note||'Ditolak oleh PDO.';
  const p=STATE.programs.find(x=>x.id===t.programId);
  STATE.approvalLog.push({id:genId(),taskName:t.nama,aoName:USERS[runame]?USERS[runame].name:runame,progName:p?p.name:'-',action:'reject',at:today(),note:note||'Ditolak oleh PDO.'});
  saveState();closeModal();showTab(activeTab);
}

document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter') doLogin();});


// Auto-login admin untuk development (logout jika ingin ganti user)
document.getElementById('loginUser').value='admin';
document.getElementById('loginPass').value='admin';
doLogin();
</script>
